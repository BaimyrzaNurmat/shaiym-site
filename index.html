<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shaiym — шай дүкені · Абай</title>
<meta name="description" content="Shaiym — ресторанные чаи, рецепты и подарочные наборы. Жақында ашылады: Абай ауылы, жаңа базар (Келес ауданы).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=PT+Sans:wght@400;700&display=swap">
<style>
  :root {
    --green-deep: #16301f;
    --green-panel: #1d3b28;
    --gold: #c8a24f;
    --gold-soft: #e6cf9a;
    --cream: #f3ecdd;
    --cream-dim: rgba(243, 236, 221, .68);
    --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    --sans: "PT Sans", "Segoe UI", Arial, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { height: 100%; }
  body {
    min-height: 100svh;
    background: radial-gradient(120% 90% at 50% 0%, #1c3a27 0%, var(--green-deep) 58%, #102417 100%);
    color: var(--cream);
    font-family: var(--sans);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  .card {
    width: 100%;
    max-width: 560px;
    background: var(--green-panel);
    border: 1px solid rgba(200, 162, 79, .55);
    box-shadow: inset 0 0 0 5px var(--green-panel), inset 0 0 0 6px rgba(200, 162, 79, .35), 0 24px 60px rgba(0, 0, 0, .35);
    padding: 56px 36px 40px;
    text-align: center;
    animation: rise .8s ease-out both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .card { animation: none; } }

  .leaf { width: 56px; height: 56px; margin: 0 auto 18px; display: block; }

  .wordmark {
    font-family: var(--serif);
    font-weight: 600;
    font-size: clamp(52px, 12vw, 76px);
    line-height: 1;
    color: var(--cream);
    letter-spacing: .01em;
  }
  .tagline {
    margin-top: 14px;
    color: var(--gold-soft);
    font-size: 13px;
    letter-spacing: .42em;
    text-indent: .42em; /* компенсирует трекинг при центровке */
    text-transform: uppercase;
  }
  .rule {
    width: 44px; height: 2px;
    background: var(--gold);
    margin: 26px auto;
    border: 0;
  }
  .soon-kk {
    font-family: var(--serif);
    font-weight: 500;
    font-size: clamp(24px, 5.4vw, 30px);
    color: var(--gold-soft);
  }
  .soon-ru {
    margin-top: 6px;
    color: var(--cream-dim);
    font-size: 15px;
    letter-spacing: .14em;
    text-indent: .14em;
    text-transform: uppercase;
  }
  .lede {
    margin: 22px auto 0;
    max-width: 40ch;
    color: var(--cream-dim);
    font-size: 16px;
    line-height: 1.65;
  }
  .lede b { color: var(--cream); font-weight: 700; }

  .actions {
    margin-top: 30px;
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .btn {
    display: inline-block;
    padding: 13px 26px;
    font-size: 15px;
    font-weight: 700;
    text-decoration: none;
    border: 1px solid var(--gold);
    transition: transform .15s ease, background-color .15s ease, color .15s ease;
  }
  .btn:focus-visible { outline: 2px solid var(--gold-soft); outline-offset: 3px; }
  .btn-solid { background: var(--gold); color: #1a3322; }
  .btn-solid:hover { background: var(--gold-soft); transform: translateY(-1px); }
  .btn-ghost { color: var(--gold-soft); background: transparent; }
  .btn-ghost:hover { background: rgba(200, 162, 79, .12); transform: translateY(-1px); }

  .address {
    margin-top: 30px;
    color: var(--cream-dim);
    font-size: 14px;
    letter-spacing: .05em;
  }
  .address .dot { color: var(--gold); padding: 0 6px; }

  footer {
    margin-top: 26px;
    padding-top: 18px;
    border-top: 1px solid rgba(200, 162, 79, .25);
    color: rgba(243, 236, 221, .45);
    font-size: 12.5px;
    letter-spacing: .08em;
  }
</style>
</head>
<body>
  <main class="card">
    <svg class="leaf" viewBox="0 0 64 64" fill="none" aria-hidden="true">
      <path d="M0 0 C6.5 -9 6.5 -22 0 -31 C-6.5 -22 -6.5 -9 0 0 Z" transform="translate(32 35)" fill="#c8a24f"/>
      <path d="M0 0 C6 -8 6 -19 0 -27 C-6 -19 -6 -8 0 0 Z" transform="translate(30.5 36) rotate(-44)" fill="#c8a24f"/>
      <path d="M0 0 C6 -8 6 -19 0 -27 C-6 -19 -6 -8 0 0 Z" transform="translate(33.5 36) rotate(44)" fill="#c8a24f"/>
      <path d="M32 37 C32 41 32 44 32 47" stroke="#c8a24f" stroke-width="2.6" stroke-linecap="round"/>
    </svg>

    <h1 class="wordmark">Shaiym</h1>
    <p class="tagline">шай дүкені</p>

    <hr class="rule">

    <p class="soon-kk">Жақында ашылады</p>
    <p class="soon-ru" lang="ru">Скоро открытие</p>

    <p class="lede" lang="ru"><b>Мейрамхана шайы — енді үйіңізде.</b><br>
    Ресторанные чаи, рецепт к каждой покупке, подарочные наборы и свежий зерновой кофе — скоро на новом базаре села Абай.</p>

    <div class="actions">
      <a class="btn btn-solid" href="https://wa.me/77064200133">Написать в WhatsApp</a>
      <a class="btn btn-ghost" href="https://www.instagram.com/shaiym.kz/">@shaiym.kz</a>
    </div>

    <p class="address">Абай ауылы<span class="dot">•</span>жаңа базар<span class="dot">•</span>Келес ауданы</p>

    <footer>© 2026 Shaiym · shaiym.kz</footer>
  </main>
</body>
</html>
